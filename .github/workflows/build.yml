name: YARA release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: windows-x64
            os: windows-latest
            platform: win
            target: portable
            arch: x64
          - id: macos-x64
            os: macos-15-intel
            platform: mac
            target: zip
            arch: x64
          - id: macos-arm64
            os: macos-15
            platform: mac
            target: zip
            arch: arm64
          - id: linux-x64
            os: ubuntu-22.04
            platform: linux
            target: deb
            arch: x64
          - id: raspberry-pi-arm64
            os: ubuntu-22.04-arm
            platform: linux
            target: AppImage
            arch: arm64
    runs-on: ${{ matrix.os }}
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - name: Check out YARA
        uses: actions/checkout@v4
      - name: Check out LXMF-rs with the MeshChat API
        uses: actions/checkout@v4
        with:
          repository: FreeTAKTeam/LXMF-rs
          ref: 1e0e7ef1d6a4e7a5e5832bee1e139a1e15673f45
          path: lxmf-rs
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Install Linux Rust build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libdbus-1-dev
      - name: Build reticulumd
        working-directory: lxmf-rs
        run: cargo build --locked --release -p reticulumd --bin reticulumd
      - name: Stage daemon and its license
        shell: bash
        run: |
          set -euo pipefail
          suffix=''
          if [[ "$RUNNER_OS" == 'Windows' ]]; then suffix='.exe'; fi
          mkdir -p build/rust
          cp "lxmf-rs/target/release/reticulumd${suffix}" build/rust/
          cp lxmf-rs/LICENSE build/rust/LICENSE-LXMF-rs
      - name: Install frontend dependencies
        run: npm ci
      - name: Check launcher
        run: npm run test:launcher
      - name: Check RNode presets
        run: npm run test:rnode-presets
      - name: Build frontend
        run: npm run build-frontend
      - name: Build application package
        shell: bash
        run: npx electron-builder --${{ matrix.platform }} ${{ matrix.target }} --${{ matrix.arch }} --publish=never
      - name: Confirm daemon and frontend are in the package
        shell: bash
        run: |
          set -euo pipefail
          test -n "$(find dist -type f -name 'reticulumd*' -print -quit)"
          test -n "$(find dist -type f -name 'index.html' -path '*/public/*' -print -quit)"
      - name: Verify Debian package contents
        if: matrix.target == 'deb'
        shell: bash
        run: |
          set -euo pipefail
          package=$(find dist -maxdepth 1 -type f -name '*.deb' -print -quit)
          test -n "$package"
          test "$(dpkg-deb --field "$package" Package)" = yara-reticulum
          test "$(dpkg-deb --field "$package" Architecture)" = amd64
          dpkg-deb --contents "$package" > "$RUNNER_TEMP/yara-deb-contents"
          grep -q '/opt/YARA/resources/bin/reticulumd$' "$RUNNER_TEMP/yara-deb-contents"
          grep -q '/opt/YARA/resources/public/index.html$' "$RUNNER_TEMP/yara-deb-contents"
          grep -q '/usr/share/applications/yara-reticulum.desktop$' "$RUNNER_TEMP/yara-deb-contents"
          grep -q '/usr/share/icons/hicolor/512x512/apps/yara-reticulum.png$' "$RUNNER_TEMP/yara-deb-contents"
          dpkg-deb --control "$package" "$RUNNER_TEMP/yara-deb-control"
          grep -q '/usr/bin/yara-reticulum' "$RUNNER_TEMP/yara-deb-control/postinst"
      - name: Test Debian package installation
        if: matrix.target == 'deb'
        shell: bash
        run: |
          set -euo pipefail
          package=$(find "$PWD/dist" -maxdepth 1 -type f -name '*.deb' -print -quit)
          docker run --rm --mount "type=bind,src=$package,dst=/tmp/yara.deb,readonly" ubuntu:22.04 bash -c '
            set -euo pipefail
            export DEBIAN_FRONTEND=noninteractive
            apt-get update -qq
            apt-get install -y --no-install-recommends yara /tmp/yara.deb
            for binary in /opt/YARA/yara-reticulum /opt/YARA/resources/bin/reticulumd; do
              ldd -r "$binary" > /tmp/yara-ldd
              if grep -E "not found|undefined symbol" /tmp/yara-ldd; then exit 1; fi
            done
            /usr/bin/yara --version
            test -x /usr/bin/yara-reticulum
            grep -Fx "StartupWMClass=yara-reticulum" /usr/share/applications/yara-reticulum.desktop
            apt-get install -y --no-install-recommends xvfb xauth curl
            Xvfb :99 -screen 0 1280x800x24 > /tmp/yara-xvfb.log 2>&1 &
            xvfb_pid=$!
            for i in $(seq 1 50); do
              if [ -S /tmp/.X11-unix/X99 ]; then break; fi
              sleep 0.1
            done
            test -S /tmp/.X11-unix/X99
            export DISPLAY=:99 RUST_POC_STATE_DIR=/tmp/yara-state RUST_POC_BIND=127.0.0.1:19537
            export RUST_POC_TCP_HOST=127.0.0.1 RUST_POC_TCP_PORT=9
            /usr/bin/yara-reticulum --no-sandbox --headless > /tmp/yara.log 2>&1 &
            app_pid=$!
            trap "kill $app_pid $xvfb_pid 2>/dev/null || true" EXIT
            for i in $(seq 1 120); do
              if curl -fsS http://127.0.0.1:19537/api/v1/config > /dev/null 2>&1; then break; fi
              if ! kill -0 "$app_pid" 2>/dev/null; then cat /tmp/yara.log; exit 1; fi
              sleep 0.25
            done
            curl -fsS http://127.0.0.1:19537/api/v1/config > /dev/null
            curl -fsS http://127.0.0.1:19537/ > /dev/null
            kill "$app_pid"
            wait "$app_pid" || true
            kill "$xvfb_pid" || true
            trap - EXIT
            apt-get remove -y yara-reticulum
            /usr/bin/yara --version
          '
      - name: Upload application package
        uses: actions/upload-artifact@v4
        with:
          name: yara-${{ matrix.id }}
          path: dist/YARA-*
          if-no-files-found: error

  release:
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: yara-*
          path: release-assets
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mapfile -t assets < <(find release-assets -maxdepth 1 -type f \
            \( -name '*.exe' -o -name '*.zip' -o -name '*.AppImage' -o -name '*.deb' \) | sort)
          test "${#assets[@]}" -eq 5
          # tags with a suffix (v1.0.0-alpha.1) are published as pre-releases
          prerelease=()
          [[ "$GITHUB_REF_NAME" == *-* ]] && prerelease=(--prerelease)
          gh release create "$GITHUB_REF_NAME" "${assets[@]}" "${prerelease[@]}" \
            --verify-tag --title "YARA $GITHUB_REF_NAME" \
            --notes-file docs/release-notes.md
