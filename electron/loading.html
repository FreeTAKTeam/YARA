<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
    <title>YARA</title>
    <style>
        /* REM "Night ops" ground; kept inline because the splash loads before the frontend */
        html, body { height: 100%; margin: 0; }
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 28px;
            color: #def1ff;
            color-scheme: dark;
            font-family: Rajdhani, "Chakra Petch", ui-sans-serif, system-ui, sans-serif;
            background-color: #020710;
            background-image:
                linear-gradient(rgb(34 69 115 / 11%) 1px, transparent 1px),
                linear-gradient(90deg, rgb(34 69 115 / 11%) 1px, transparent 1px),
                radial-gradient(circle at 78% -15%, rgb(35 124 255 / 34%), transparent 45%),
                radial-gradient(circle at -5% 100%, rgb(10 164 255 / 20%), transparent 40%),
                linear-gradient(170deg, #030914, #091632 44%, #06142f);
            background-size: 26px 26px, 26px 26px, auto, auto, auto;
        }
        .tile {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 152px;
            height: 152px;
            border-radius: 34px;
            border: 1px solid rgb(73 173 255 / 48%);
            background: rgb(7 25 54 / 84%);
            box-shadow: 0 0 60px rgb(20 240 255 / 18%), inset 0 1px 0 rgb(147 214 255 / 12%);
        }
        .eyebrow {
            font-weight: 700;
            font-size: 0.8rem;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            color: #38bdf8;
        }
        h1 {
            margin: 8px 0 0;
            font-weight: 700;
            font-size: 3.6rem;
            line-height: 1;
            letter-spacing: 0.3em;
            padding-left: 0.3em;
            color: #f3fbff;
            text-align: center;
        }
        .progress {
            position: relative;
            width: 320px;
            height: 4px;
            border-radius: 999px;
            background: rgb(9 61 108 / 68%);
            overflow: hidden;
        }
        .progress span {
            position: absolute;
            inset: 0 auto 0 0;
            width: 38%;
            border-radius: 999px;
            background: linear-gradient(110deg, #00a8ff, #14f0ff);
            box-shadow: 0 0 12px rgb(20 240 255 / 50%);
            animation: scan 1.4s ease-in-out infinite;
        }
        .status {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 12px;
            font-weight: 600;
            font-size: 0.92rem;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: #6ac1ff;
        }
        .status i { width: 8px; height: 8px; border-radius: 4px; background: #ffcf7b; }
        .version {
            position: fixed;
            bottom: 28px;
            font-family: ui-monospace, Menlo, Consolas, monospace;
            font-size: 0.82rem;
            color: #9cb3d6;
        }
        /* mesh links pulse, then each node lights up in turn */
        .mesh { animation: pulse 2.4s ease-in-out infinite; }
        .node { animation: blink 2.4s ease-in-out infinite; }
        .node:nth-of-type(2) { animation-delay: 0.4s; }
        .node:nth-of-type(3) { animation-delay: 0.8s; }
        @keyframes scan { from { transform: translateX(-100%); } to { transform: translateX(270%); } }
        @keyframes pulse { 0%, 100% { opacity: 0.25; } 50% { opacity: 0.7; } }
        @keyframes blink { 0%, 100% { fill: #071936; } 20% { fill: #14f0ff; } 40% { fill: #071936; } }
        @media (prefers-reduced-motion: reduce) {
            .mesh, .node, .progress span { animation: none; }
        }
    </style>
</head>
<body>

    <!-- logo: same mark as src/frontend/components/YaraLogo.vue -->
    <div class="tile">
        <svg role="img" aria-label="YARA" width="104" height="104" viewBox="0 0 24 24" fill="none" stroke="#14f0ff" stroke-linecap="round" stroke-linejoin="round">
            <path class="mesh" d="M5 4H19M5 4 12 20.5M19 4 12 20.5" stroke-width="1" opacity="0.45"/>
            <path d="M5 4 12 12.5 19 4M12 12.5V20.5" stroke-width="2.4"/>
            <circle class="node" cx="5" cy="4" r="2" fill="#071936" stroke-width="1.6"/>
            <circle class="node" cx="19" cy="4" r="2" fill="#071936" stroke-width="1.6"/>
            <circle class="node" cx="12" cy="20.5" r="2" fill="#071936" stroke-width="1.6"/>
            <circle cx="12" cy="12.5" r="1.7" fill="#14f0ff" stroke="none"/>
        </svg>
    </div>

    <!-- about -->
    <div>
        <div class="eyebrow">Yet Another Reticulum Application</div>
        <h1>YARA</h1>
    </div>

    <!-- loading -->
    <div>
        <div class="progress" aria-hidden="true"><span></span></div>
        <div class="status" role="status"><i aria-hidden="true"></i><span id="status-text">Starting Rust daemon</span></div>
    </div>

    <div class="version"><span id="app-version"></span>MeshChat-compatible Rust client</div>

<script>

    showAppVersion();
    check();

    // reassure the user when the daemon takes a while (first launch creates identity and config)
    setTimeout(() => {
        document.getElementById("status-text").innerText = "Still starting, waiting for the daemon API";
    }, 15000);

    async function showAppVersion() {
        const appVersion = await window.electron.appVersion();
        document.getElementById("app-version").innerText = "v" + appVersion + " · ";
    }

    async function check() {

        try {

            // fetch status api
            const url = (await window.electron.serverUrl()) + "/api/v1/status";
            const result = await fetch(url, {
                cache: "no-store", // don't read page from cache, we want to make sure server is up
            });

            // check status api says ok
            const status = result.status;
            const data = await result.json();
            if(status === 200 && data.status === "ok"){
                onReady();
                return;
            }

        } catch(e) {}

        // try again shortly
        setTimeout(check, 250);

    }

    function onReady() {
        // redirect to yara and bypass browser cache
        var timestamp = (new Date()).getTime();
        window.electron.serverUrl().then(url => {
            window.location.href = url + "/?nocache=" + timestamp;
        });
    }

</script>

</body>
</html>
